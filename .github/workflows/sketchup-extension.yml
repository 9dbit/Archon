name: SketchUp Extension CI

on:
  pull_request:
    paths:
      - 'sketchup-extension/**'
      - '.github/workflows/sketchup-extension.yml'
  push:
    branches:
      - main
    paths:
      - 'sketchup-extension/**'
      - '.github/workflows/sketchup-extension.yml'

jobs:
  ruby-syntax:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'

      - name: Validate Ruby syntax
        run: |
          set -euo pipefail
          find sketchup-extension -type f -name '*.rb' -print0 \
            | xargs -0 -n1 ruby -c
