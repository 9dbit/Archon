name: Prompt Layout CI

on:
  pull_request:
    paths:
      - 'packages/domain/src/prompt-layout.ts'
      - 'packages/domain/src/prompt-layout.test.mjs'
      - 'packages/domain/src/drawing-ir.ts'
      - 'packages/domain/src/drawing-ir.test.mjs'
      - 'packages/domain/src/layout-scenarios.test.mjs'
      - 'packages/domain/src/index.ts'
      - 'apps/web/app/api/integrations/sketchup/layout/**'
      - 'apps/web/app/layout-sandbox/**'
      - 'apps/web/components/layout-review-sandbox.tsx'
      - 'sketchup-extension/**'
      - '.github/workflows/prompt-layout.yml'
  push:
    branches:
      - main
    paths:
      - 'packages/domain/src/prompt-layout.ts'
      - 'packages/domain/src/prompt-layout.test.mjs'
      - 'packages/domain/src/drawing-ir.ts'
      - 'packages/domain/src/drawing-ir.test.mjs'
      - 'packages/domain/src/layout-scenarios.test.mjs'
      - 'packages/domain/src/index.ts'
      - 'apps/web/app/api/integrations/sketchup/layout/**'
      - 'apps/web/app/layout-sandbox/**'
      - 'apps/web/components/layout-review-sandbox.tsx'
      - 'sketchup-extension/**'
      - '.github/workflows/prompt-layout.yml'

jobs:
  prompt-layout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Prompt layout + drawing IR + synthetic scenario tests
        run: node --experimental-transform-types --test packages/domain/src/prompt-layout.test.mjs packages/domain/src/drawing-ir.test.mjs packages/domain/src/layout-scenarios.test.mjs
      - name: Validate SketchUp Ruby syntax
        run: |
          set -euo pipefail
          find sketchup-extension -type f -name '*.rb' -print0 | xargs -0 -n1 ruby -c
