name: ARCHON CI

on:
  pull_request:
  push:
    branches:
      - main
      - agent/**

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: archon_test
          POSTGRES_PASSWORD: archon_test
          POSTGRES_DB: archon_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U archon_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.17.1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: APS fail-closed tests
        run: node --experimental-transform-types --test packages/engine-adapters/src/aps.test.mjs

      - name: DWG geometry input tests
        run: node --experimental-transform-types --test packages/engine-adapters/src/dwg-input.test.mjs

      - name: APS resource provisioning guard tests
        run: node --test packages/autocad-plugin/provision-resources.test.mjs

      - name: APS sandbox storage tests
        run: node --test packages/autocad-plugin/sandbox-storage.test.mjs

      - name: APS output transport and report tests
        run: node --test packages/autocad-plugin/output-transport.test.mjs

      - name: Authenticated seed ingestion tests
        run: node --test packages/autocad-plugin/seed-upload.test.mjs

      - name: Sandbox manifest binding tests
        run: node --test packages/autocad-plugin/sandbox-manifest.test.mjs

      - name: Apply migrations to disposable PostgreSQL
        run: pnpm --filter @archon/db db:migrate
        env:
          DATABASE_URL: postgres://archon_test:archon_test@localhost:5432/archon_test

      - name: Durable ledger integration and submission guard tests
        run: |
          node --test packages/db/src/sandbox-ledger.test.mjs
          node --test packages/db/src/sandbox-activation.test.mjs
          node --test packages/db/src/sandbox-receipt-store.test.mjs
          node --test packages/autocad-plugin/sandbox-operator.test.mjs
          node --test packages/autocad-plugin/sandbox-resources.test.mjs
          node --test packages/autocad-plugin/sandbox-artifacts.test.mjs
          node --test packages/autocad-plugin/sandbox-submission.test.mjs
          node --test packages/autocad-plugin/sandbox-approval.test.mjs
          node --test packages/autocad-plugin/sandbox-review.test.mjs
          node --test packages/autocad-plugin/sandbox-transport.test.mjs
          node --test packages/autocad-plugin/sandbox-receipt.test.mjs
        env:
          ARCHON_LEDGER_TEST_DATABASE_URL: postgres://archon_test:archon_test@localhost:5432/archon_test

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

  autocad_plugin:
    name: Compile and package AutoCAD plugin
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate fixture from ARCHON serializer
        run: node --experimental-transform-types packages/autocad-plugin/generate-test-input.mjs
      - name: Validate plugin input contract
        run: dotnet run --project packages/autocad-plugin/tests/ContractTests.csproj -- archon-contract-fixture.json
      - name: Compile against Autodesk AutoCAD 2026 SDK
        run: dotnet build packages/autocad-plugin/Archon.AutoCAD.csproj -c Release
      - name: Package and inspect bundle
        run: python packages/autocad-plugin/package_bundle.py packages/autocad-plugin/bin/Release/net8.0-windows/Archon.AutoCAD.dll
      - name: Verify resource configuration builder
        run: node packages/autocad-plugin/prepare-activity.mjs test_namespace
      - uses: actions/upload-artifact@v4
        with:
          name: archon-autocad-bundle
          path: packages/autocad-plugin/artifacts/*
          if-no-files-found: error

  aps_worker:
    name: Compile and verify APS worker container
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build isolated provisioning worker
        run: docker build -f packages/autocad-plugin/worker.Dockerfile -t archon-aps-worker .
      - name: Verify offline bundle without network or credentials
        run: docker run --rm --network none -e ARCHON_APS_WORKER_MODE=OFFLINE -e ARCHON_APS_WORKER_EXIT=1 archon-aps-worker
      - name: Verify provisioning guards in runtime image
        run: docker run --rm --network none --entrypoint node archon-aps-worker --test packages/autocad-plugin/provision-resources.test.mjs

      - name: Verify storage guards in runtime image
        run: docker run --rm --network none --entrypoint node archon-aps-worker --test packages/autocad-plugin/sandbox-storage.test.mjs

      - name: Verify output transport guards in runtime image
        run: docker run --rm --network none --entrypoint node archon-aps-worker --test packages/autocad-plugin/output-transport.test.mjs
