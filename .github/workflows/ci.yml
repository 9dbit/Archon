name: ARCHON CI

on:
  pull_request:
  push:
    branches:
      - main
      - agent/**

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.17.1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: APS fail-closed tests
        run: node --experimental-transform-types --test packages/engine-adapters/src/aps.test.mjs

      - name: DWG geometry input tests
        run: node --experimental-transform-types --test packages/engine-adapters/src/dwg-input.test.mjs

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build
